version: '3.8'

networks:
  tum-sovereign-mesh:
    name: tum-sovereign-mesh
    driver: bridge

volumes:
  clickhouse_data:
    name: tum_siem_clickhouse_data
  clickhouse_logs:
    name: tum_siem_clickhouse_logs
  siem_logs:
    name: tum_siem_app_logs

services:
  # ==============================================================================
  # 1. TUM Post-Quantum Cryptography Engine (NIST FIPS 203 & 204 Lattice Core)
  # ==============================================================================
  tum-quantum:
    build:
      context: ./tum-quantum
      dockerfile: Dockerfile
    image: tum/quantum-engine:1.0.0
    container_name: tum-quantum-engine
    restart: unless-stopped
    ports:
      - "5100:5100"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5100
      - DOTNET_EnableDiagnostics=0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5100/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tum-sovereign-mesh

  # ==============================================================================
  # 2. TUM Trust Security Identity Gateway & Hardware HAL (01_TUM_Trust_Security)
  # ==============================================================================
  tum-trust-security:
    build:
      context: ./tum-trust-security
      dockerfile: Dockerfile
    image: tum/trust-security-gateway:1.1.0
    container_name: tum-trust-security-gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - IdentityVerification__EnableMock=true
      - IdentityVerification__Passport__EnableActiveAuthentication=true
      - PqcEngine__Endpoint=http://tum-quantum:5100
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tum-sovereign-mesh

  # ==============================================================================
  # 3. ClickHouse Telemetry Lakehouse (OpenSIEM Ingestion & Storage)
  # ==============================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: tum-clickhouse-server
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=tum_siem
      - CLICKHOUSE_USER=tum_admin
      - CLICKHOUSE_PASSWORD=tum_sovereign_2026
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - tum-sovereign-mesh

  # ==============================================================================
  # 4. TUM OpenSIEM Core & SOC Web HUD (tum-socs)
  # ==============================================================================
  tum-socs:
    build:
      context: ./tum-socs
      dockerfile: Dockerfile
    image: tum/opensiem-core:2.0.0
    container_name: tum-socs-server
    restart: unless-stopped
    ports:
      - "5200:5200"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5200
      - CLICKHOUSE_ENDPOINT=http://clickhouse:8123
      - CLICKHOUSE_DATABASE=tum_siem
      - CLICKHOUSE_USER=tum_admin
      - CLICKHOUSE_PASSWORD=tum_sovereign_2026
      - TUM_RISK_THRESHOLD=70.0
      - TUM_DEFENSE_MODE=ActiveDefense
    volumes:
      - siem_logs:/app/tum_logs
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5200/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - tum-sovereign-mesh

  # ==============================================================================
  # 5. TUM Sovereign CyberMesh (Autonomous XSIAM, SOAR & Defense Cloud)
  # ==============================================================================
  tum-cybermesh:
    build:
      context: ./tum-cybermesh
      dockerfile: Dockerfile
    image: tum/cybermesh-cloud:1.0.0
    container_name: tum-cybermesh-node
    restart: unless-stopped
    ports:
      - "7799:7799"
    environment:
      - NODE_ENV=production
      - PORT=7799
      - SIEM_ENDPOINT=http://tum-socs:5200
      - PQC_ENDPOINT=http://tum-quantum:5100
      - IDENTITY_GATEWAY_URL=http://tum-trust-security:5000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7799/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tum-sovereign-mesh

  # ==============================================================================
  # 6. TUM National Trust Fabric (Sovereign Digital Identity & Legal Notary)
  # ==============================================================================
  tum-trust-fabric:
    build:
      context: ./tum-trust-fabric
      dockerfile: Dockerfile
    image: tum/trust-fabric:1.0.0
    container_name: tum-trust-fabric-node
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - NODE_ENV=production
      - PORT=8088
      - IDENTITY_GATEWAY_URL=http://tum-trust-security:5000
      - PQC_ENDPOINT=http://tum-quantum:5100
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tum-sovereign-mesh

  # ==============================================================================
  # 7. TUM Agentic WorkOS (Autonomous AI Process ERP & Executive HUD)
  # ==============================================================================
  tum-agentic-workos:
    build:
      context: ./tum-agentic-workos
      dockerfile: Dockerfile
    image: tum/agentic-workos:1.0.0
    container_name: tum-workos-node
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - SOAR_ENDPOINT=http://tum-cybermesh:7799
      - IDENTITY_GATEWAY_URL=http://tum-trust-security:5000
      - TRUST_FABRIC_URL=http://tum-trust-fabric:8088
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tum-sovereign-mesh

  # ==============================================================================
  # 8. TUM Central Director (Sovereign ADE, Monaco IDE & Fleet Mesh Hub)
  # ==============================================================================
  tum-central-director:
    build:
      context: ./tum-central-director
      dockerfile: Dockerfile
    image: tum/central-director:1.0.0
    container_name: tum-central-director-node
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - NODE_ENV=production
      - PORT=5432
      - TUM_ROOT=/workspace
      - WORKOS_ENDPOINT=http://tum-agentic-workos:8080
      - CYBERMESH_ENDPOINT=http://tum-cybermesh:7799
      - TRUSTFABRIC_ENDPOINT=http://tum-trust-fabric:8088
      - SOCS_ENDPOINT=http://tum-socs:5200
      - QUANTUM_ENDPOINT=http://tum-quantum:5100
      - TRUST_SECURITY_ENDPOINT=http://tum-trust-security:5000
    volumes:
      - .:/workspace:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5432/api/fleet/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tum-sovereign-mesh
